<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./public/css/main.css">
    <title>Tic Tac Toe</title>
  </head>
  <body class="flex flex-col place-items-center bg-[#F4D6BC] font-costum">
    <h1 class="mt-20 mx-auto text-5xl mb-10 text-[#153450] font-extrabold">TicTacToe Game</h1>
    <div id="tableContainer" class="board grid gap-0 grid-cols-3 grid-rows-3 shadow-xl">
      <div id="1" class="cells w-36 h-36 border-2 border-white border-t-0 border-l-0 flex justify-center items-center text-9xl text-[#153450]"></div>
      <div id="2" class="cells w-36 h-36 border-2 border-white border-t-0 flex justify-center items-center text-9xl text-[#153450]"></div>
      <div id="3" class="cells w-36 h-36 border-2 border-white border-t-0 border-r-0 flex justify-center items-center text-9xl text-[#153450]"></div>
      <div id="4" class="cells w-36 h-36 border-2 border-white border-l-0 flex justify-center items-center text-9xl text-[#153450]"></div>
      <div id="5" class="cells w-36 h-36 border-2 border-white flex justify-center items-center text-9xl text-[#153450]"></div>
      <div id="6" class="cells w-36 h-36 border-2 border-white border-r-0 flex justify-center items-center text-9xl text-[#153450]"></div>
      <div id="7" class="cells w-36 h-36 border-2 border-white border-b-0 border-l-0 flex justify-center items-center text-9xl text-[#153450]"></div>
      <div id="8" class="cells w-36 h-36 border-2 border-white border-b-0 flex justify-center items-center text-9xl text-[#153450]"></div>
      <div id="9" class="cells w-36 h-36 border-2 border-white border-b-0 border-r-0 flex justify-center items-center text-9xl text-[#153450]"></div>
    </div>
    <div class="winBack">
      <span class="wining"></span>
      <button class="reset"></button>
    </div>
    <script type="module" src="./public/javascript/main.js"></script>
  </body>
</html>
